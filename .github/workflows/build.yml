name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:linux
      - run: npm run deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: VTER Fighting68 — Offline Configurator ${{ github.ref_name }}
          body: |
            Unofficial offline build of the VTER web configurator for Linux,
            Windows and macOS. No account, no telemetry, no network access.
            Tested with the VTER Fighting68 HE (`0C45:8030`); other VTER models
            that use the same configurator should work but are untested.

            ### Downloads

            | Platform | Asset |
            | --- | --- |
            | Linux x86_64 | `VTER-<version>-linux-x86_64.AppImage` — single file, no install |
            | Debian / Ubuntu | `vter-desktop_<version>_amd64.deb` |
            | Windows x64 | `VTER-<version>-win-x64.exe` — portable, unsigned |
            | macOS (Intel / Apple Silicon) | `VTER-<version>-mac-x64.zip`, `VTER-<version>-mac-arm64.zip` |

            ### Verified

            On Linux: starts fully offline, detects the keyboard, reads its
            settings, renders the full configuration UI, and profiles persist
            across restarts.

            Not verified: writing settings back to the keyboard (the vendor's
            protocol code ships unmodified), Windows and macOS runtime on real
            hardware, and other VTER models. Music effects are unavailable —
            the vendor implements them with a Windows-only helper.

            ### Notes

            Windows and macOS builds are unsigned: expect SmartScreen /
            Gatekeeper warnings (see the README for how to proceed).

            Includes the vendor web application with written permission from
            MechLands, official VTER distributor (2026-10-23). Credit to
            VTER / DriveAll — https://vter.driveall.cn/ — no trademark claim.
            Not affiliated. Removed on request.
          files: artifacts/*
          generate_release_notes: false
          fail_on_unmatched_files: true
